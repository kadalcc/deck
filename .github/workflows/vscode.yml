name: VS Code extension

# Publishes packages/vscode (kadal.kadal-deck) to the Visual Studio Marketplace and Open VSX
# whenever main carries a version neither store has yet. The version comes from
# packages/vscode/package.json, bumped by a changeset that names "kadal-deck" (the extension's
# package name), so a release is: add the changeset, merge the Version PR, and this runs.
#
# No long-lived tokens:
#   Open VSX     trusted publishing: ovsx trades this job's GitHub OIDC token for a short-lived one.
#                Set up once on open-vsx.org → Settings → Trusted Publishers (kadalcc/deck,
#                workflow vscode.yml); that needs the namespace verified. Until then an OVSX_PAT
#                secret is used if present.
#   Marketplace  Microsoft Entra ID through GitHub OIDC (azure/login, then `vsce --azure-credential`)
#                when the repo variables AZURE_CLIENT_ID and AZURE_TENANT_ID are set; or a
#                Marketplace token in the VSCE_PAT secret. With neither, that store is skipped
#                with a notice and the other still publishes.

on:
  push:
    branches: [main]
    paths: ["packages/vscode/package.json"]
  workflow_dispatch:

concurrency: vscode-publish

permissions:
  contents: read
  id-token: write # Open VSX trusted publishing and the Entra ID login

jobs:
  publish:
    if: github.repository == 'kadalcc/deck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Which stores still need this version
        id: need
        run: |
          version=$(node -p "require('./packages/vscode/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Marketplace: the gallery API lists every published version of the extension.
          market=$(curl -fsS -X POST https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery \
            -H 'content-type: application/json' -H 'accept: application/json;api-version=7.2-preview.1' \
            -d '{"filters":[{"criteria":[{"filterType":7,"value":"kadal.kadal-deck"}]}],"flags":1}' \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const e=JSON.parse(s).results?.[0]?.extensions?.[0];console.log((e?.versions??[]).map(v=>v.version).join(" "))})' || true)
          if [[ " $market " == *" $version "* ]]; then echo "marketplace=false" >> "$GITHUB_OUTPUT"; else echo "marketplace=true" >> "$GITHUB_OUTPUT"; fi
          # Open VSX: the version's own endpoint is a 404 until it is published (and scanned).
          if curl -fsS -o /dev/null "https://open-vsx.org/api/kadal/kadal-deck/$version"; then echo "openvsx=false" >> "$GITHUB_OUTPUT"; else echo "openvsx=true" >> "$GITHUB_OUTPUT"; fi
          echo "kadal.kadal-deck $version — Marketplace has: ${market:-none}"

      - name: Build and package
        if: steps.need.outputs.marketplace == 'true' || steps.need.outputs.openvsx == 'true'
        run: |
          bun install --frozen-lockfile
          bun run build
          (cd packages/vscode && bun test)
          KADAL_VSIX_OUT="$RUNNER_TEMP/kadal-deck.vsix" bun run --cwd packages/vscode package

      - name: Sign in to Microsoft Entra ID (Marketplace)
        if: steps.need.outputs.marketplace == 'true' && vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to the Visual Studio Marketplace
        if: steps.need.outputs.marketplace == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          USE_ENTRA: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' }}
        run: |
          if [ "$USE_ENTRA" = "true" ]; then
            npx -y @vscode/vsce@4.0.0 publish --packagePath "$RUNNER_TEMP/kadal-deck.vsix" --azure-credential --skip-duplicate
          elif [ -n "$VSCE_PAT" ]; then
            npx -y @vscode/vsce@4.0.0 publish --packagePath "$RUNNER_TEMP/kadal-deck.vsix" --skip-duplicate
          else
            echo "::notice::Marketplace skipped: set AZURE_CLIENT_ID + AZURE_TENANT_ID (Entra ID) or the VSCE_PAT secret."
          fi

      - name: Publish to Open VSX
        if: steps.need.outputs.openvsx == 'true'
        # Trusted publishing when no OVSX_PAT secret is set: ovsx trades the job's OIDC token for a
        # short-lived one. Open VSX takes trusted publishers only on a verified namespace, so the
        # secret bridges the time until then; delete it once the trusted publisher is in place.
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx -y ovsx@1.3.0 publish --packagePath "$RUNNER_TEMP/kadal-deck.vsix" --skip-duplicate

      - name: Keep the .vsix
        if: steps.need.outputs.marketplace == 'true' || steps.need.outputs.openvsx == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kadal-deck-${{ steps.need.outputs.version }}.vsix
          path: ${{ runner.temp }}/kadal-deck.vsix
