name: CI

# Every check runs in its own job, all at once, on GitHub's hosted runners (free for a public
# repo), so the wall time is the slowest job rather than the sum: the showcase tour alone was
# ~15 minutes in one process, and is now six jobs (tools/showcase-check.mjs says how a split run
# still holds the export to the walk). Each job builds what it needs; that is ~30 s, less than
# handing a build between jobs costs.

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "**/CHANGELOG.md"
      - ".changeset/*.md"
      - ".github/workflows/vscode.yml"
  pull_request:
    paths-ignore:
      - "*.md"
      - "**/CHANGELOG.md"
      - ".changeset/*.md"
      - ".github/workflows/vscode.yml"
  # release.yml starts this on the "Version packages" branch. That PR is opened with GITHUB_TOKEN,
  # so its pull_request run waits for a maintainer to approve it, and ends as a failure when the
  # PR is merged or updated first; a dispatched run is allowed to start on its own.
  workflow_dispatch:

# One run per branch or PR: a newer push cancels the one in flight. main's runs all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: typecheck · test · lint · packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build: true
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      # npm silently rewrites (and for `./` bin paths, drops) what it doesn't like at publish time.
      # `npm pkg fix` applies the same normalisation; any diff means a package.json would ship
      # different from what's in the repo.
      - name: package.json files are already what npm publishes
        run: |
          npm install -g npm@^11.15.0
          for d in packages/*/; do (cd "$d" && npm pkg fix); done
          git diff --exit-code -- 'packages/*/package.json'
      - name: The showcase builds against the built packages
        run: bun run build
        working-directory: examples/showcase

  smoke:
    name: smoke · packed packages, scaffolded deck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build: true
          playwright: true
      - name: Pack, scaffold with @kadal/create-deck, npm install the tarballs, kadal-deck build
        run: node tools/smoke.mjs --out "$RUNNER_TEMP/smoke"
      - name: The scaffolded deck in a browser (dev + published override)
        run: node tools/browser-check.mjs "$RUNNER_TEMP/smoke/my-talk"

  shell:
    name: shell · the prebuilt shell in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build: true
          playwright: true
      - name: The prebuilt shell compiles a deck in the browser, published and as a preview
        run: node tools/shell-check.mjs

  showcase:
    name: showcase · ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every shard reports, so one run shows everything that broke.
      fail-fast: false
      matrix:
        include:
          # Every slide and click (~3.5 min), and the views that count against what it saw.
          - shard: walk
            args: '--only "walk:" --only "print:" --only "export: /export" --only "scroll view:"'
          # Every other view: dark, themes, keys, tools, presenter, audience, scroll, embeds.
          - shard: views
            args: '--skip "walk:" --skip "print:" --skip "export:" --skip "scroll view:"'
          # `kadal-deck export` (~7 min for all five formats in one process), a share each.
          - shard: export-pdf
            args: '--only "export: kadal-deck" --export-format pdf'
          - shard: export-png-pptx-md
            args: '--only "export: kadal-deck" --export-format png,pptx,md'
          # The editable PPTX is the slowest format (~6 min alone): half the slides each.
          - shard: export-pptx-editable-1
            args: '--only "export: kadal-deck" --export-format pptx-editable --export-range 1-74'
          - shard: export-pptx-editable-2
            args: '--only "export: kadal-deck" --export-format pptx-editable --export-range 75-'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build: true
          playwright: true
      - name: The showcase, ${{ matrix.shard }}
        run: node tools/showcase-check.mjs ${{ matrix.args }}
      - name: Screenshots and exports, for looking at
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-check-${{ matrix.shard }}
          path: examples/showcase/check-output
          retention-days: 7
