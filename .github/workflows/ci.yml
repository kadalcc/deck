name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The CLI's bin (packages/deck/dist/cli/bin.js) only exists after the build, so the install
      # above couldn't link `kadal-deck` into the showcase; installing again links it.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      # npm silently rewrites (and for `./` bin paths, drops) what it doesn't like at publish time.
      # `npm pkg fix` applies the same normalisation; any diff means a package.json would ship
      # different from what's in the repo.
      - name: package.json files are already what npm publishes
        run: |
          npm install -g npm@^11.15.0
          for d in packages/*/; do (cd "$d" && npm pkg fix); done
          git diff --exit-code -- 'packages/*/package.json'
      - name: The showcase builds against the built packages
        run: bun run build
        working-directory: examples/showcase

  smoke:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack, scaffold with create-kadal-deck, npm install the tarballs, kadal-deck build
        run: node tools/smoke.mjs --out "$RUNNER_TEMP/smoke"
      - run: npx playwright install --with-deps chromium
      - name: The scaffolded deck in a browser (dev + published override)
        run: node tools/browser-check.mjs "$RUNNER_TEMP/smoke/my-talk"
