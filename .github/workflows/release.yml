name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    if: github.repository == 'kadalcc/kadal-deck'
    runs-on: ubuntu-latest
    # Nothing is published until the NPM_TOKEN secret exists; before that the job builds and tests only.
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      # Opens a "Version packages" PR while changesets are pending; once that PR is merged,
      # publishes every changed package to npm with provenance.
      - uses: changesets/action@v1
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          version: bunx changeset version
          publish: bun run release
          title: "Version packages"
          commit: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
